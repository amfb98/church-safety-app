{% extends "base.html" %}
{% block title %}Edit Message{% endblock %}
{% block content %}
<h2 class="mb-4">Edit Message</h2>
<form method="POST" class="card card-body">
    <div class="mb-3">
        <label class="form-label">Message</label>
        <textarea name="content" class="form-control" rows="4" required>{{ msg.content }}</textarea>
    </div>
    <button type="submit" class="btn btn-primary">Save</button>
    <a href="{{ url_for('chat') }}" class="btn btn-secondary">Cancel</a>
</form>
{% endblock %}
