{% extends "base.html" %}
{% block title %}New Message{% endblock %}
{% block content %}
<h2 class="mb-4">New Message</h2>
<form method="POST" class="card card-body shadow-sm">
    <div class="mb-3">
        <label class="form-label">Title *</label>
        <input type="text" name="title" class="form-control" required>
    </div>
    <div class="mb-3">
        <label class="form-label">Content *</label>
        <textarea name="content" class="form-control" rows="6" required></textarea>
    </div>
    {% if current_user.role == 'admin' %}
    <div class="form-check mb-3">
        <input class="form-check-input" type="checkbox" name="is_pinned" id="pin">
        <label class="form-check-label" for="pin">Pin this post</label>
    </div>
    {% endif %}
    <button type="submit" class="btn btn-primary">Post</button>
    <a href="{{ url_for('messages') }}" class="btn btn-secondary">Cancel</a>
</form>
{% endblock %}
