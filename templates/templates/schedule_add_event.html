{% extends "base.html" %}
{% block title %}Add Event{% endblock %}
{% block content %}

<div class="mb-3">
    <a href="{{ url_for('schedule') }}" class="btn btn-sm btn-outline-secondary">&laquo; Back to Calendar</a>
</div>

<h2 class="mb-4">Add Special Event / Meeting</h2>

<form method="POST" class="card card-body shadow-sm">
    <div class="row g-3">
        <div class="col-md-8">
            <label class="form-label">Event Name *</label>
            <input type="text" name="title" class="form-control" required placeholder="e.g. Safety Meeting, Christmas Service">
        </div>
        <div class="col-md-4">
            <label class="form-label">Date *</label>
            <input type="date" name="event_date" class="form-control" required>
        </div>

        <div class="col-md-4">
            <label class="form-label">Event Type</label>
            <select name="event_type" class="form-select">
                <option value="Special Event">Special Event</option>
                <option value="Meeting">Meeting</option>
                <option value="Other">Other</option>
            </select>
        </div>
        <div class="col-md-4">
            <label class="form-label">Start Time</label>
            <input type="time" name="start_time" class="form-control">
        </div>
        <div class="col-md-4">
            <label class="form-label">End Time</label>
            <input type="time" name="end_time" class="form-control">
        </div>

        <div class="col-12">
            <label class="form-label">Location</label>
            <input type="text" name="location" class="form-control" placeholder="Optional">
        </div>
    </div>

    <div class="mt-4">
        <button type="submit" class="btn btn-primary">Create Event</button>
        <a href="{{ url_for('schedule') }}" class="btn btn-secondary">Cancel</a>
    </div>
</form>

{% endblock %}
