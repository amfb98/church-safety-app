{% extends "base.html" %}
{% block title %}Edit Profile{% endblock %}
{% block content %}

<div class="mb-3">
    <a href="{{ url_for('profile', user_id=user.id) }}" class="btn btn-sm btn-outline-secondary">&laquo; Back to Profile</a>
</div>

<h2 class="mb-4">Edit Profile</h2>

<form method="POST" enctype="multipart/form-data" class="card card-body shadow-sm">
    <div class="row g-3">
        <div class="col-md-6">
            <label class="form-label">Username *</label>
            <input type="text" name="username" class="form-control" required value="{{ user.username }}">
        </div>

        <div class="col-md-6">
            <label class="form-label">Full Name *</label>
            <input type="text" name="full_name" class="form-control" required value="{{ user.full_name }}">
        </div>

        <div class="col-12">
            <label class="form-label">Profile Photo</label>
            <input type="file" name="photo" class="form-control" accept="image/*">
            {% if user.profile_photo %}
            <small class="text-muted">Leave blank to keep current photo</small>
            {% endif %}
        </div>
    </div>

    <div class="mt-4">
        <button type="submit" class="btn btn-primary">Save Changes</button>
        <a href="{{ url_for('profile', user_id=user.id) }}" class="btn btn-secondary">Cancel</a>
    </div>
</form>
{% endblock %}
