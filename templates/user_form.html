{% extends "base.html" %}
{% block title %}Add User{% endblock %}
{% block content %}
<h2 class="mb-4">Add User</h2>
<form method="POST" class="card card-body shadow-sm col-md-6">
    <div class="mb-3">
        <label class="form-label">Username *</label>
        <input type="text" name="username" class="form-control" required pattern="[a-zA-Z0-9_]+" title="Letters, numbers, underscore">
    </div>
    <div class="mb-3">
        <label class="form-label">Full Name *</label>
        <input type="text" name="full_name" class="form-control" required>
    </div>
    <div class="mb-3">
        <label class="form-label">Password *</label>
        <input type="password" name="password" class="form-control" required minlength="6">
    </div>
    <div class="mb-3">
        <label class="form-label">Role</label>
        <select name="role" class="form-select">
            <option value="member">Member</option>
            <option value="admin">Admin</option>
        </select>
    </div>
    <button type="submit" class="btn btn-primary">Create User</button>
    <a href="{{ url_for('users') }}" class="btn btn-secondary">Cancel</a>
</form>
{% endblock %}
