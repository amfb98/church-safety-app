{% extends "base.html" %}
{% block title %}{{ 'Edit User' if user else 'Add User' }}{% endblock %}
{% block content %}
<h2 class="mb-4">{{ 'Edit User' if user else 'Add User' }}</h2>

<form method="POST" class="card card-body">
    <div class="row g-3">
        <div class="col-md-6">
            <label class="form-label">Full Name *</label>
            <input type="text" name="full_name" class="form-control" required
                   value="{{ user.full_name if user else '' }}">
        </div>

        {% if not user %}
        <div class="col-md-6">
            <label class="form-label">Username *</label>
            <input type="text" name="username" class="form-control" required
                   placeholder="lowercase, no spaces">
        </div>
        {% endif %}

        <div class="col-md-6">
            <label class="form-label">Role</label>
            <select name="role" class="form-select">
                <option value="member" {% if user and user.role == 'member' %}selected{% endif %}>Member</option>
                <option value="admin" {% if user and user.role == 'admin' %}selected{% endif %}>Admin</option>
            </select>
        </div>

        <div class="col-md-6">
            <label class="form-label">On Safety Team?</label>
            <div class="form-check mt-2">
                <input class="form-check-input" type="checkbox" name="is_safety_team" id="is_safety_team"
                       {% if not user or user.is_safety_team %}checked{% endif %}>
                <label class="form-check-label" for="is_safety_team">
                    Yes – can be assigned roles on the schedule
                </label>
            </div>
        </div>

        <div class="col-md-6">
            <label class="form-label">
                {% if user %}New Password (leave blank to keep current){% else %}Password *{% endif %}
            </label>
            <input type="password" name="password" class="form-control"
                   {% if not user %}required{% endif %}>
        </div>
    </div>

    <div class="mt-4">
        <button type="submit" class="btn btn-primary">Save</button>
        <a href="{{ url_for('users') }}" class="btn btn-secondary">Cancel</a>
    </div>
</form>
{% endblock %}
