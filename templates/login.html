{% extends "base.html" %}
{% block title %}Login - CNAZ Safety{% endblock %}
{% block content %}
<div class="row justify-content-center mt-5">
    <div class="col-md-5 col-lg-4">
        <div class="card shadow">
            <div class="card-body p-4">
                <div class="text-center mb-4">
                    <img src="{{ url_for('static', filename='icon-192.png') }}" alt="CNAZ Safety" 
                         style="height: 80px; width: 80px; border-radius: 12px; margin-bottom: 12px;">
                    <h3 class="mt-2">CNAZ Safety</h3>
                    <p class="text-muted">Team Login</p>
                </div>
                <form method="POST">
                    <div class="mb-3">
                        <label class="form-label">Username</label>
                        <input type="text" name="username" class="form-control" required autofocus>
                    </div>
                    <div class="mb-3">
                        <label class="form-label">Password</label>
                        <input type="password" name="password" class="form-control" required>
                    </div>
                    <button type="submit" class="btn btn-primary w-100">Login</button>
                </form>
            </div>
        </div>
    </div>
</div>
{% endblock %}
