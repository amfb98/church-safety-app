{% extends "base.html" %}
{% block title %}{{ 'Edit' if event else 'Sign Up' }}{% endblock %}
{% block content %}
<h2 class="mb-4">{{ 'Edit Shift' if event else 'Sign Up' }}</h2>

<form method="POST" class="card card-body shadow-sm">
    <div class="row g-3">

        <!-- Person (dropdown of users) -->
        <div class="col-md-6">
            <label class="form-label">Person *</label>
            <select name="title" class="form-select" required>
                <option value="">-- Select Person --</option>
                {% for u in users %}
                <option value="{{ u.full_name }}" {% if event and event.title == u.full_name %}selected{% endif %}>
                    {{ u.full_name }}
                </option>
                {% endfor %}
            </select>
        </div>

        <!-- Event Type -->
        <div class="col-md-6">
            <label class="form-label">Event Type</label>
            <select name="event_type" class="form-select" id="eventType">
                <option value="Church Service" {% if event and event.event_type == 'Church Service' %}selected{% endif %}>Church Service</option>
                <option value="Special Event" {% if event and event.event_type == 'Special Event' %}selected{% endif %}>Special Event</option>
                <option value="Meeting" {% if event and event.event_type == 'Meeting' %}selected{% endif %}>Meeting</option>
            </select>
        </div>

        <!-- Date -->
        <div class="col-md-6">
            <label class="form-label">Date *</label>
            <input type="date" name="event_date" class="form-control" required 
                   value="{{ event.event_date.isoformat() if event else default_date }}">
        </div>

        <!-- Role -->
        <div class="col-md-6">
            <label class="form-label">Role</label>
            <select name="role" class="form-select">
                <option value="">-- Select Role --</option>
                <option value="Roamer" {% if event and event.role == 'Roamer' %}selected{% endif %}>Roamer</option>
                <option value="Sanctuary" {% if event and event.role == 'Sanctuary' %}selected{% endif %}>Sanctuary</option>
                <option value="Lobby" {% if event and event.role == 'Lobby' %}selected{% endif %}>Lobby</option>
            </select>
        </div>

        <!-- Service -->
        <div class="col-md-6">
            <label class="form-label">Service</label>
            <select name="service" class="form-select" id="serviceSelect">
                <option value="">-- Select Service --</option>
                <option value="First" {% if event and event.service == 'First' %}selected{% endif %}>First (9:30–10:30)</option>
                <option value="Second" {% if event and event.service == 'Second' %}selected{% endif %}>Second (11:00–12:00)</option>
                <option value="Both" {% if event and event.service == 'Both' %}selected{% endif %}>Both (9:30–12:00)</option>
            </select>
        </div>

        <!-- These will be auto-filled for Church Service, but still available for Special Events -->
        <div class="col-md-6" id="timeFields">
            <label class="form-label">Start Time</label>
            <input type="time" name="start_time" class="form-control" value="{{ event.start_time if event else '' }}">
        </div>
        <div class="col-md-6" id="endTimeField">
            <label class="form-label">End Time</label>
            <input type="time" name="end_time" class="form-control" value="{{ event.end_time if event else '' }}">
        </div>

        <div class="col-12">
            <label class="form-label">Location</label>
            <input type="text" name="location" class="form-control" 
                   value="{{ event.location if event else '1436 Deerfield Rd' }}">
        </div>

    </div>

    <div class="mt-4 d-flex gap-2 flex-wrap">
        <button type="submit" class="btn btn-primary">Save</button>
        <a href="{{ url_for('schedule') }}" class="btn btn-secondary">Cancel</a>
        {% if event %}
        <a href="{{ url_for('schedule_add') }}?copy={{ event.id }}" class="btn btn-outline-success">Copy</a>
        {% endif %}
    </div>
</form>

{% if event %}
<div class="mt-3">
    <form method="POST" action="{{ url_for('schedule_delete', event_id=event.id) }}" 
          onsubmit="return confirm('Delete this shift?');">
        <button type="submit" class="btn btn-outline-danger">Delete</button>
    </form>
</div>
{% endif %}
{% endblock %}
