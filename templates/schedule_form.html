{% extends "base.html" %}
{% block title %}{{ 'Edit' if event else 'Add' }} Schedule Event{% endblock %}
{% block content %}
<h2 class="mb-4">{{ 'Edit' if event else 'Add' }} Schedule Event</h2>

<form method="POST" class="card card-body shadow-sm">
    <div class="row g-3">
        <div class="col-md-8">
            <label class="form-label">Name / Title *</label>
            <input type="text" name="title" class="form-control" required 
                   value="{{ event.title if event else '' }}" placeholder="e.g. Alec B">
        </div>
        <div class="col-md-4">
            <label class="form-label">Date *</label>
            <input type="date" name="event_date" class="form-control" required 
                   value="{{ event.event_date.isoformat() if event else default_date }}">
        </div>

        <div class="col-md-4">
            <label class="form-label">Role</label>
            <select name="role" class="form-select">
                <option value="">-- Select Role --</option>
                <option value="Roamer" {% if event and event.role == 'Roamer' %}selected{% endif %}>Roamer</option>
                <option value="Sanctuary" {% if event and event.role == 'Sanctuary' %}selected{% endif %}>Sanctuary</option>
                <option value="Lobby" {% if event and event.role == 'Lobby' %}selected{% endif %}>Lobby</option>
            </select>
        </div>

        <div class="col-md-4">
            <label class="form-label">Service</label>
            <select name="service" class="form-select">
                <option value="">-- Select Service --</option>
                <option value="First" {% if event and event.service == 'First' %}selected{% endif %}>First</option>
                <option value="Second" {% if event and event.service == 'Second' %}selected{% endif %}>Second</option>
                <option value="Both" {% if event and event.service == 'Both' %}selected{% endif %}>Both</option>
            </select>
        </div>

        <div class="col-md-4">
            <label class="form-label">Location</label>
            <input type="text" name="location" class="form-control" value="{{ event.location if event else '' }}">
        </div>

        <div class="col-md-6">
            <label class="form-label">Start Time</label>
            <input type="time" name="start_time" class="form-control" value="{{ event.start_time if event else '' }}">
        </div>
        <div class="col-md-6">
            <label class="form-label">End Time</label>
            <input type="time" name="end_time" class="form-control" value="{{ event.end_time if event else '' }}">
        </div>

        <div class="col-12">
            <label class="form-label">Notes</label>
            <textarea name="description" class="form-control" rows="2">{{ event.description if event else '' }}</textarea>
        </div>
    </div>

    <div class="mt-4 d-flex gap-2 align-items-center">
        <button type="submit" class="btn btn-primary">Save</button>
        <a href="{{ url_for('schedule') }}" class="btn btn-secondary">Cancel</a>

        {% if event %}
        <form method="POST" action="{{ url_for('schedule_delete', event_id=event.id) }}" 
              onsubmit="return confirm('Delete this event permanently?');" class="ms-auto">
            <button type="submit" class="btn btn-outline-danger">Delete</button>
        </form>
        {% endif %}
    </div>
</form>
{% endblock %}
